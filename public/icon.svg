<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#0f172a"/>
      <stop offset="100%" stopColor="#020617"/>
    </linearGradient>
    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stopColor="#10b981"/>
      <stop offset="100%" stopColor="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="#1e293b" stroke-width="4"/>

  <!-- Glowing Accent Orbit -->
  <circle cx="256" cy="256" r="180" stroke="url(#pulseGrad)" stroke-width="8" stroke-dasharray="16 12" opacity="0.3"/>

  <!-- Athletic Pulse Cardiogram & Dumbbell Fusion Icon -->
  <g filter="url(#glow)">
    <!-- Pulse wave path -->
    <path d="M 96 256 L 180 256 L 220 140 L 292 372 L 340 216 L 372 256 L 416 256" 
          stroke="url(#pulseGrad)" 
          stroke-width="28" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
          
    <!-- Dynamic Power Nodes -->
    <circle cx="220" cy="140" r="14" fill="#10b981"/>
    <circle cx="292" cy="372" r="14" fill="#06b6d4"/>
    <circle cx="340" cy="216" r="10" fill="#10b981"/>
  </g>

  <!-- Central Dumbbell Core Overlay -->
  <g transform="translate(256, 256)">
    <circle cx="0" cy="0" r="18" fill="#ffffff"/>
    <circle cx="0" cy="0" r="8" fill="#0f172a"/>
  </g>
</svg>
